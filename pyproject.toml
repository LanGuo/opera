[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opera"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.99.0",
    "fastapi>=0.111",
    "google-genai>=1.75.0",
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tooluniverse>=1.1.11",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
ollama = ["ollama>=0.4"]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
hypothesis-ledger = "hypothesis_ledger.server:run"
bioagent-review = "reviewer.review:main"
bioagent-propose = "task_proposer.wizard:main"

[tool.hatch.build.targets.wheel]
packages = ["hypothesis_ledger", "reviewer", "task_proposer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: end-to-end tests against live server processes"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
